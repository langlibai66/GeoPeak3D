[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geopeak3d"
version = "0.1.0"
description = "Geometry-guided multi-peak disambiguation for 3D acoustic source localization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Chenxu Yang"},
  {name = "Chenyu Wang"},
  {name = "Zhenhuan Xu"},
  {name = "Yidi Li"},
  {name = "Dimitrios Kanoulas"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.0",
  "tqdm>=4.65",
]

[tool.setuptools.packages.find]
include = ["geopeak3d*"]
